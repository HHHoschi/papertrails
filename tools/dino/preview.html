<!doctype html>
<html><head><meta charset="utf-8"><title>Figure preview</title>
<style>html,body{margin:0;background:#2a2725}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const url = q.get('model') || '/models/dino.glb';
const yaw = Number(q.get('yaw') ?? 35) * Math.PI / 180, pitch = Number(q.get('pitch') ?? 12) * Math.PI / 180;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const s = new THREE.Scene();
s.add(new THREE.HemisphereLight(0xfff4e0, 0x404040, 1.6));
const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(1, 2, 1.5); s.add(d);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 10);
const dist = 1.6; cam.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, 0.3 + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
cam.lookAt(0, 0.3, 0);
new GLTFLoader().load(url, (g) => {
  g.scene.traverse((o) => { if (o.isMesh) { const m = o.material; o.material = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide, emissive: m.emissive, emissiveIntensity: m.emissiveIntensity }); o.material.flatShading = true; } });
  s.add(g.scene); r.render(s, cam); document.title = 'ready';
});
</script></body></html>
